<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flea Market</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Logo do brechó">
    </div>
    <div class="disclaimer">
      Entre em contato conosco pelo ícone do Whatsapp<br>
      Os pagamentos podem ser realizados por Pix, cartão de débito ou crédito<br>
    </div>
  </header>

  <nav class="categorias">
    <button onclick="window.location.href='index.html'">Todos</button>
    <button onclick="window.location.href='index.html?categoria=cozinha'">Cozinha</button>
    <button onclick="window.location.href='index.html?categoria=eletrodomesticos'">Eletrodomésticos</button>
    <button onclick="window.location.href='index.html?categoria=moveis'">Móveis</button>
    <button onclick="window.location.href='index.html?categoria=diversos'">Diversos</button>
  </nav>

  <main id="detalhes-produto" class="pagina-item"></main>

  <a href="https://wa.me/5519998613769?text=Olá! Vi um produto no FleaMarket e gostaria de mais informações." class="whatsapp" target="_blank">
    <img src="images/whatsapp.png" alt="WhatsApp">
  </a>
  <a href="index.html" class="voltar">🔙</a>

  <!-- SCRIPT DO ITEM -->
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    fetch('data/products.json')
      .then(res => res.json())
      .then(produtos => {
        const produto = produtos.find(p => p.id == id);
        const container = document.getElementById('detalhes-produto');

        if (produto) {
          container.innerHTML = `
            <div class="detalhes-info esquerda">
              <h2>${produto.nome}</h2>
              <p><strong>Estado:</strong> ${produto.estado}</p>
              <p><strong>Preço:</strong> ${produto.preco}</p>
              <p><strong>Descrição:</strong> ${produto.descricao || 'Sem descrição disponível.'}</p>
            </div>
            <div class="galeria">
              ${produto.fotos.map(foto => `
                <img data-src="images/${foto}" alt="${produto.nome}" loading="lazy">
              `).join('')}
            </div>
          `;

          // Lazy loading correto
          setTimeout(observeImages, 100);
        } else {
          container.innerHTML = `<p>Produto não encontrado.</p>`;
        }
      })
      .catch(error => {
        console.error(error);
        document.getElementById('detalhes-produto').innerHTML =
          `<p>Erro ao carregar produto.</p>`;
      });
  </script>

  <!-- SCRIPT GLOBAL -->
  <script src="script.js"></script>
</body>
</html>
