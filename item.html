<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flea Market</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="images/logo.jpg" alt="Logo do brechó">
    </div>
    <div class="disclaimer">
      Entre em contato conosco pelo ícone do Whatsapp<br>
      Os pagamentos devem ser realizados por Pix ou dinheiro<br>
      Não aceitamos parcelamentos<br>
      <!-- Não entregamos -->
    </div>
  </header>

  <nav class="categorias">
    <button onclick="window.location.href='index.html'">Todos</button>
    <button onclick="window.location.href='index.html?categoria=cozinha'">Cozinha</button>
    <button onclick="window.location.href='index.html?categoria=eletrodomesticos'">Eletrodomésticos</button>
    <button onclick="window.location.href='index.html?categoria=moveis'">Móveis</button>
    <button onclick="window.location.href='index.html?categoria=diversos'">Diversos</button>
  </nav>

  <main id="detalhes-produto" class="pagina-item"></main>

  <a href="https://wa.me/5519996730368?text=Olá! Vi um produto no FleaMarket e gostaria de mais informações." class="whatsapp" target="_blank">
    <img src="images/whatsapp.png" alt="WhatsApp">
  </a>
  <a href="index.html" class="voltar">🔙</a>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    // Função de lazy loading para a galeria
    function initializeGalleryLazyLoading() {
      if ('IntersectionObserver' in window) {
        const imageObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              const src = img.getAttribute('data-src');
              if (src) {
                const imageLoader = new Image();
                imageLoader.onload = function() {
                  img.src = src;
                  img.classList.add('loaded');
                  img.removeAttribute('data-src');
                };
                imageLoader.src = src;
              }
              observer.unobserve(img);
            }
          });
        }, {
          rootMargin: '50px 0px',
          threshold: 0.1
        });

        const lazyImages = document.querySelectorAll('.galeria img[data-src]');
        lazyImages.forEach(img => imageObserver.observe(img));
      }
    }

    fetch('data/products.json')
      .then(res => res.json())
      .then(produtos => {
        const produto = produtos.find(p => p.id === id);
        const container = document.getElementById('detalhes-produto');

        if (produto) {
          container.innerHTML = `
            <div class="detalhes-info esquerda">
              <h2>${produto.nome}</h2>
              <p><strong>Estado:</strong> ${produto.estado}</p>
              <p><strong>Preço:</strong> ${produto.preco}</p>
              <p><strong>Descrição:</strong> ${produto.descricao || 'Sem descrição disponível.'}</p>
            </div>
            <div class="galeria">
              ${produto.fotos.map(foto => `
                <img data-src="images/${foto}" alt="${produto.nome}" loading="lazy">
              `).join('')}
            </div>
          `;
          
          // Inicializar lazy loading para a galeria
          setTimeout(initializeGalleryLazyLoading, 100);
        } else {
          container.innerHTML = `<p>Produto não encontrado.</p>`;
        }
      })
      .catch(error => {
        console.error('Erro ao carregar produto:', error);
        document.getElementById('detalhes-produto').innerHTML = `<p>Erro ao carregar produto.</p>`;
      });
  </script>
</body>
</html>
